<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitchForge — AI Sales Call Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090B;--surface:#111113;--surface2:#18181b;--border:#1e1e1e;
  --text:#fafafa;--text2:#71717a;--text3:#52525b;
  --accent:#f97316;--accent-hover:#ea580c;
  --success:#10b981;--success-bg:rgba(16,185,129,0.08);--success-border:rgba(16,185,129,0.2);
  --danger:#ef4444;--danger-bg:rgba(239,68,68,0.08);--danger-border:rgba(239,68,68,0.2);
  --info:#3b82f6;--warn-bg:rgba(250,204,21,0.06);--warn-border:rgba(250,204,21,0.15);
}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;line-height:1.5}
.container{max-width:680px;margin:0 auto;padding:24px 20px 60px}

/* Nav */
.nav{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;background:var(--surface);border-radius:12px;overflow:hidden}
.nav-tab{flex:1;padding:14px 8px;text-align:center;font-size:0.85rem;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;border-bottom:2px solid transparent}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(249,115,22,0.04)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Hero */
.hero{text-align:center;padding:32px 0 28px}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;color:var(--text);cursor:pointer}
.logo span{color:var(--accent)}
.tagline{color:var(--text2);font-size:0.875rem;margin-top:4px;font-weight:500;letter-spacing:0.02em}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 28px;border:none;border-radius:10px;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all .15s ease;font-family:inherit;outline:none}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:#333;color:var(--text)}
.btn-sm{padding:8px 16px;font-size:0.8rem;border-radius:8px}
.btn-xs{padding:5px 12px;font-size:0.75rem;border-radius:6px}

/* Hero actions */
.hero-actions{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.hero-actions .btn-primary{padding:14px 36px;font-size:1rem;border-radius:12px;font-weight:700}

/* Scenario card */
#scenario-card{display:none;margin-top:24px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.scenario-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.sc-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.sc-product{font-size:1.15rem;font-weight:700;color:var(--text)}
.sc-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);font-weight:600;display:block;margin-bottom:2px}
.badge{padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;white-space:nowrap}
.badge-easy{background:rgba(16,185,129,0.15);color:#34d399}
.badge-medium{background:rgba(245,158,11,0.15);color:#fbbf24}
.badge-hard{background:rgba(239,68,68,0.15);color:#f87171}
.badge-expert{background:rgba(139,92,246,0.15);color:#a78bfa}
.badge-profile{background:rgba(249,115,22,0.15);color:#fb923c}

.sc-body{padding:20px 24px 24px}
.sc-section{margin-bottom:20px}
.sc-section:last-child{margin-bottom:0}
.sc-company{color:var(--text2);font-size:0.85rem;line-height:1.6;margin-bottom:16px}
.sc-buyer-name{color:var(--text);font-size:0.9rem;font-weight:600}
.sc-buyer-persona{color:var(--text2);font-size:0.82rem;font-style:italic;margin-top:2px;line-height:1.5}

.sc-block{border-radius:10px;padding:14px 16px}
.sc-pain{background:var(--surface2);border:1px solid var(--border)}
.sc-pain-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);font-weight:600;margin-bottom:6px}
.sc-pain p{color:var(--text);font-size:0.85rem;line-height:1.6;opacity:0.85}

.sc-goal{background:var(--success-bg);border:1px solid var(--success-border)}
.sc-goal-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--success);font-weight:600;margin-bottom:4px}
.sc-goal p{color:var(--text);font-size:0.9rem}

.sc-rules{background:var(--danger-bg);border:1px solid var(--danger-border)}
.sc-rules-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--danger);font-weight:600;margin-bottom:4px}
.sc-rules p{color:var(--text);font-size:0.85rem;line-height:1.6;opacity:0.85}

.sc-brief{background:var(--surface2);border:1px solid var(--border)}
.sc-brief-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;padding:0}
.sc-brief-toggle span{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);font-weight:600}
.sc-brief-toggle .arrow{color:var(--text3);transition:transform .15s;font-size:0.7rem}
.sc-brief-toggle.open .arrow{transform:rotate(180deg)}
.sc-brief-content{display:none;margin-top:12px;color:var(--text2);font-size:0.85rem;line-height:1.6}
.sc-brief-content.show{display:block}

/* Start call */
.start-call-wrap{margin-top:24px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

/* Call interface */
#call-ui{display:none;margin-top:24px}
.call-active{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.call-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.call-status{display:flex;align-items:center;gap:10px}
.call-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.call-label{font-size:0.8rem;font-weight:600;color:var(--text)}
.call-timer{font-size:0.8rem;color:var(--text2);font-variant-numeric:tabular-nums;font-weight:500}
.call-end-btn{padding:8px 16px;font-size:0.8rem;border-radius:8px}

.transcript{padding:16px 20px;max-height:320px;overflow-y:auto;font-size:0.82rem;line-height:1.7;scrollbar-width:thin;scrollbar-color:#333 transparent}
.transcript::-webkit-scrollbar{width:4px}
.transcript::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.t-buyer{color:var(--info);display:block;margin-bottom:2px}
.t-you{color:var(--success);display:block;margin-bottom:2px}
.t-sys{color:var(--text3);display:block;margin-bottom:2px;font-style:italic}

/* Hidden fields */
.hidden-fields{display:none}

/* ===== MY COMPANY TAB ===== */
.profile-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;cursor:pointer;transition:border-color .15s}
.profile-card:hover{border-color:#333}
.profile-card-header{display:flex;justify-content:space-between;align-items:center}
.profile-card-name{font-weight:700;font-size:0.95rem}
.profile-card-product{color:var(--text2);font-size:0.82rem;margin-top:2px}
.profile-card-actions{display:flex;gap:6px}

.profile-form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;margin-top:16px}
.form-group{margin-bottom:16px}
.form-group:last-child{margin-bottom:0}
.form-label{display:block;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text2);font-weight:600;margin-bottom:6px}
.form-input,.form-textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:0.875rem;font-family:inherit;outline:none;transition:border-color .15s}
.form-input:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.6}
.form-actions{display:flex;gap:10px;margin-top:20px}

/* ===== ANALYTICS TAB ===== */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-value{font-size:1.5rem;font-weight:800;color:var(--text)}
.stat-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text2);font-weight:600;margin-top:2px}

/* Radar chart */
.radar-wrap{margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.radar-title{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text2);font-weight:600;margin-bottom:16px;text-align:center}
.radar-container{position:relative;width:260px;height:260px;margin:0 auto}
.radar-svg{width:100%;height:100%}

/* Grade distribution */
.grade-grid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.grade-chip{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;text-align:center;min-width:50px}
.grade-letter{font-size:1.2rem;font-weight:800}
.grade-count{font-size:0.7rem;color:var(--text2);margin-top:2px}
.grade-a{color:#34d399}.grade-b{color:#60a5fa}.grade-c{color:#fbbf24}.grade-d{color:#fb923c}.grade-f{color:#f87171}

/* Trend */
.trend-dots{display:flex;gap:6px;align-items:flex-end;justify-content:center;margin-top:8px}
.trend-dot{width:10px;height:10px;border-radius:50%;transition:all .2s}
.trend-bar{width:28px;border-radius:4px;transition:height .3s}

/* Call history */
.history-table-wrap{margin-top:20px;overflow-x:auto}
.history-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.history-table th{text-align:left;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border)}
.history-table td{padding:10px;border-bottom:1px solid var(--border);color:var(--text)}
.history-table tr:hover td{background:rgba(249,115,22,0.03)}

/* Strengths/weaknesses */
.insight-row{display:flex;gap:12px;margin-top:16px}
.insight-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.insight-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:6px}
.insight-value{font-size:0.95rem;font-weight:700}

/* ===== SCORECARD MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.modal-content{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:28px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:1.1rem;font-weight:700}
.modal-close{background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer;padding:4px 8px;line-height:1}
.modal-close:hover{color:var(--text)}

.score-grade{font-size:3rem;font-weight:800;text-align:center;margin:8px 0}
.score-total{text-align:center;font-size:0.85rem;color:var(--text2);margin-bottom:20px}
.score-feedback{text-align:center;color:var(--text);font-size:0.9rem;line-height:1.6;margin-bottom:24px;padding:0 12px}

.score-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.score-row:last-child{border-bottom:none}
.score-cat{flex:1;font-size:0.82rem;font-weight:600;color:var(--text)}
.score-bar-wrap{width:100px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.score-bar{height:100%;border-radius:3px;transition:width .5s}
.score-pts{font-size:0.75rem;color:var(--text2);font-weight:600;min-width:30px;text-align:right}
.score-cat-feedback{font-size:0.78rem;color:var(--text2);line-height:1.5;margin-top:4px;padding-left:0}

.scoring-spinner{text-align:center;padding:40px;color:var(--text2)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.section-title{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text2);font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text2);font-size:0.9rem}

/* Voice selector */
.voice-selector{margin-top:16px}
.voice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.voice-option{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:center;font-size:0.8rem;color:var(--text2);transition:all .15s}
.voice-option:hover{border-color:#333}
.voice-option.selected{border-color:var(--accent);color:var(--accent);background:rgba(249,115,22,0.06)}

/* Mobile */
@media(max-width:480px){
  .container{padding:16px 14px 40px}
  .hero{padding:24px 0 20px}
  .sc-header,.sc-body{padding-left:16px;padding-right:16px}
  .hero-actions .btn-primary{padding:12px 28px;font-size:0.9rem}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .insight-row{flex-direction:column}
  .nav-tab{font-size:0.78rem;padding:12px 6px}
  .profile-form{padding:16px}
}
</style>
</head>
<body>
<div class="container">

  <!-- Hero -->
  <div class="hero">
    <div class="logo" onclick="switchTab('practice')">Pitch<span>Forge</span></div>
    <div class="tagline">AI Sales Call Simulator</div>
  </div>

  <!-- Nav -->
  <div class="nav">
    <div class="nav-tab active" data-tab="practice" onclick="switchTab('practice')">Practice</div>
    <div class="nav-tab" data-tab="company" onclick="switchTab('company')">My Company</div>
    <div class="nav-tab" data-tab="analytics" onclick="switchTab('analytics')">Analytics</div>
  </div>

  <!-- PRACTICE TAB -->
  <div id="tab-practice" class="tab-content active">
    <div class="hero-actions">
      <button class="btn btn-primary" onclick="randomCall()">🎲 Random Scenario</button>
      <button class="btn btn-ghost" onclick="showProfilePicker()">🎯 Practice My Pitch</button>
    </div>
    <div id="scenario-card"></div>
    <div id="start-call-wrap" class="start-call-wrap" style="display:none">
      <button id="callBtn" class="btn btn-primary" onclick="startCall()" style="padding:14px 40px;font-size:1rem;border-radius:12px">Start Voice Call</button>
    </div>
    <div id="call-ui">
      <div class="call-active">
        <div class="call-header">
          <div class="call-status">
            <div class="call-dot"></div>
            <span class="call-label">Live Call</span>
          </div>
          <span class="call-timer" id="call-timer">00:00</span>
        </div>
        <div class="transcript" id="transcript"></div>
        <div style="padding:12px 20px 16px;display:flex;justify-content:center">
          <button class="btn btn-danger call-end-btn" onclick="startCall()">End Call</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MY COMPANY TAB -->
  <div id="tab-company" class="tab-content">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="section-title" style="border:none;margin:0;padding:0">Company Profiles</div>
      <button class="btn btn-primary btn-sm" onclick="newProfile()">+ New Profile</button>
    </div>
    <div id="profile-list" class="profile-list"></div>
    <div id="profile-form-wrap" style="display:none"></div>
  </div>

  <!-- ANALYTICS TAB -->
  <div id="tab-analytics" class="tab-content">
    <div id="analytics-content"></div>
  </div>

  <!-- Hidden fields -->
  <div class="hidden-fields">
    <input id="product"><input id="buyer"><textarea id="script"></textarea>
    <select id="difficulty"><option value="easy">easy</option><option value="medium" selected>medium</option><option value="hard">hard</option><option value="expert">expert</option></select>
  </div>

</div>

<!-- Scorecard Modal -->
<div id="scorecard-modal" style="display:none"></div>

<script type="module">
import { RetellWebClient } from 'https://esm.sh/retell-client-js-sdk@2.0.7';
window.RetellWebClient = RetellWebClient;
const RETELL_KEY = 'key_c833df9a891bacfc002cf8714c0c';
const RETELL_AGENT = 'agent_2d2969f4f54ab3192ceaf4ab5e';
const OPENAI_KEY = atob('c2stcHJvai1vaDBRLWhvc0VsLWV6QXZIZV8tQ05wa3FodVF5Zmo4MlZ4V1dMa1EwS3lhZUVXRUhWaXB3T0hNN1E4eERfZm80TXVmTVppdlJZNFQzQmxCSkVKRTZ1S3RyM1JVelJHTjhCSXl0YlZRTjJISlR4a21ubFJic3J1SnFuVGQ3ZUtIc3hpTUpwMVRSWkVzUzlCNnFwM2NHTTMzVW9JQQ==');

let client = null;
let isConnected = false;
let callTimerInterval = null;
let callSeconds = 0;
let callTranscript = [];
let callStartTime = null;
const callBtn = document.getElementById('callBtn');
const transcriptEl = document.getElementById('transcript');
const callUi = document.getElementById('call-ui');
const callTimerEl = document.getElementById('call-timer');
const startCallWrap = document.getElementById('start-call-wrap');

// ===== TAB NAVIGATION =====
window.switchTab = function(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + tab));
  if (tab === 'company') renderProfileList();
  if (tab === 'analytics') renderAnalytics();
};

function log(msg, type) {
  const span = document.createElement('span');
  span.className = type === 'buyer' ? 't-buyer' : type === 'you' ? 't-you' : 't-sys';
  span.textContent = msg;
  transcriptEl.appendChild(span);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
  // Save to transcript array
  if (type !== 'sys') {
    callTranscript.push({ role: type === 'buyer' ? 'buyer' : 'user', text: msg });
  }
}

function startTimer() {
  callSeconds = 0;
  callTimerEl.textContent = '00:00';
  callTimerInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    callTimerEl.textContent = m + ':' + s;
  }, 1000);
}

function stopTimer() {
  if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
}

function showCallUi(show) {
  callUi.style.display = show ? 'block' : 'none';
  startCallWrap.style.display = show ? 'none' : 'flex';
}

// ===== COMPANY PROFILES =====
function getProfiles() {
  return JSON.parse(localStorage.getItem('pf_profiles') || '[]');
}
function saveProfiles(profiles) {
  localStorage.setItem('pf_profiles', JSON.stringify(profiles));
}

window.newProfile = function() {
  renderProfileForm(null);
};

window.editProfile = function(idx) {
  const profiles = getProfiles();
  if (profiles[idx]) renderProfileForm(idx);
};

window.deleteProfile = function(idx, e) {
  e.stopPropagation();
  if (!confirm('Delete this profile?')) return;
  const profiles = getProfiles();
  profiles.splice(idx, 1);
  saveProfiles(profiles);
  renderProfileList();
};

window.saveProfile = function(editIdx) {
  const fields = ['profileName','productName','productDesc','buyerPersona','painPoints','talkingPoints','pricing','rules','voice'];
  const data = {};
  for (const f of fields) {
    const el = document.getElementById('pf-' + f);
    data[f] = el ? el.value.trim() : '';
  }
  if (!data.profileName || !data.productName) {
    alert('Company name and product name are required.');
    return;
  }
  const profiles = getProfiles();
  if (editIdx !== null && profiles[editIdx]) {
    profiles[editIdx] = data;
  } else {
    profiles.push(data);
  }
  saveProfiles(profiles);
  renderProfileList();
  document.getElementById('profile-form-wrap').style.display = 'none';
};

window.cancelProfileForm = function() {
  document.getElementById('profile-form-wrap').style.display = 'none';
};

window.selectProfileForCall = function(idx) {
  const profiles = getProfiles();
  const p = profiles[idx];
  if (!p) return;
  // Build a scenario from the profile
  currentScenario = {
    id: 'custom-' + idx,
    voice: p.voice || '11labs-Kate',
    product: p.productName,
    company: p.profileName,
    companyDesc: p.productDesc || 'Custom company profile.',
    buyer: p.buyerPersona || 'Decision Maker',
    buyerPersona: 'Interested but skeptical buyer. Evaluate the product fairly.',
    painPoints: p.painPoints || 'Looking for a better solution.',
    goal: 'Present your product effectively and close the deal.',
    rules: p.rules || 'Be professional and honest.',

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ===== POST-CALL SCORING =====
function saveCallResult(result) {
  const history = JSON.parse(localStorage.getItem('pf_history') || '[]');
  history.unshift(result);
  localStorage.setItem('pf_history', JSON.stringify(history));
}

function getCallHistory() {
  return JSON.parse(localStorage.getItem('pf_history') || '[]');
}

async function gradeCall(scenario, transcript, duration) {
  const transcriptText = transcript.map(t => (t.role === 'buyer' ? 'BUYER: ' : 'SELLER: ') + t.text).join('\n');
  const scenarioCtx = `Product: ${scenario.product}\nCompany: ${scenario.company}\nBuyer: ${scenario.buyer}\nPain Points: ${scenario.painPoints}\nGoal: ${scenario.goal}\nRules: ${scenario.rules}`;

  const prompt = `You are a sales call evaluator. Grade this call on 6 criteria (1-5 each):

OPENING (15pts): Did they hook the buyer? State value early? Sound confident?
DISCOVERY (25pts): Did they ask good questions? Listen more than talk? Uncover real pain points?
OBJECTION HANDLING (20pts): Did they handle pushback calmly and effectively?
VALUE COMMUNICATION (15pts): Did they connect features to the buyer's specific problems?
CLOSING (15pts): Did they establish clear next steps? Create urgency?
RULES COMPLIANCE (10pts): Did they follow the scenario rules? Stay within constraints?

Scenario: ${scenarioCtx}
Transcript: ${transcriptText}

Respond ONLY with valid JSON, no markdown fences:
{"opening":{"score":4,"feedback":"..."},"discovery":{"score":3,"feedback":"..."},"objection_handling":{"score":4,"feedback":"..."},"value_comm":{"score":3,"feedback":"..."},"closing":{"score":2,"feedback":"..."},"rules":{"score":5,"feedback":"..."},"overall_feedback":"...","grade":"B"}`;

  try {
    const resp = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + OPENAI_KEY },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [{ role: 'user', content: prompt }],
        temperature: 0.3,
        max_tokens: 800
      })
    });
    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '';
    // Parse JSON from response
    const jsonMatch = content.match(/\{[\s\S]*\}/);
    if (jsonMatch) return JSON.parse(jsonMatch[0]);
    return null;
  } catch(e) {
    console.error('Grading error:', e);
    return null;
  }
}

function showScorecardModal(scores, scenario, duration) {
  const modal = document.getElementById('scorecard-modal');
  if (!scores) {
    modal.innerHTML = `<div class="modal-overlay" onclick="closeScorecard()"><div class="modal-content" onclick="event.stopPropagation()"><div class="scoring-spinner"><p style="color:var(--text)">Unable to score this call. The transcript may have been too short.</p><button class="btn btn-primary btn-sm" onclick="closeScorecard()" style="margin-top:16px">Close</button></div></div></div>`;
    modal.style.display = 'block';
    return;
  }

  const cats = [
    {key:'opening',label:'Opening',max:15},
    {key:'discovery',label:'Discovery',max:25},
    {key:'objection_handling',label:'Objection Handling',max:20},
    {key:'value_comm',label:'Value Communication',max:15},
    {key:'closing',label:'Closing',max:15},
    {key:'rules',label:'Rules Compliance',max:10}
  ];

  let totalPts = 0;
  cats.forEach(c => { totalPts += (scores[c.key]?.score || 0); });
  const totalPct = Math.round((totalPts / 25) * 100);
  const grade = scores.grade || 'C';

  const gradeColors = {A:'#34d399',B:'#60a5fa',C:'#fbbf24',D:'#fb923c',F:'#f87171'};

  modal.innerHTML = `
    <div class="modal-overlay" onclick="closeScorecard()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-title">Call Scorecard</div>
          <button class="modal-close" onclick="closeScorecard()">&times;</button>
        </div>
        <div style="text-align:center;margin-bottom:4px">
          <div style="font-size:0.75rem;color:var(--text2)">${esc(scenario.product)} · ${duration}</div>
        </div>
        <div class="score-grade" style="color:${gradeColors[grade]||'#fafafa'}">${grade}</div>
        <div class="score-total">${totalPct}/100 points</div>
        <div class="score-feedback">${esc(scores.overall_feedback || '')}</div>
        <div class="section-title" style="margin-top:8px">Score Breakdown</div>
        ${cats.map(c => {
          const sc = scores[c.key] || {score:0,feedback:''};
          const pts = Math.round((sc.score / 5) * c.max);
          const pct = (sc.score / 5) * 100;
          const color = pct >= 80 ? '#34d399' : pct >= 60 ? '#fbbf24' : '#f87171';
          return `<div class="score-row"><div class="score-cat">${c.label}<div class="score-cat-feedback">${esc(sc.feedback||'')}</div></div><div class="score-bar-wrap"><div class="score-bar" style="width:${pct}%;background:${color}"></div></div><div class="score-pts">${pts}/${c.max}</div></div>`;
        }).join('')}
        <div style="text-align:center;margin-top:20px">
          <button class="btn btn-primary" onclick="closeScorecard()">Close</button>
        </div>
      </div>
    </div>
  `;
  modal.style.display = 'block';
}

window.closeScorecard = function() {
  document.getElementById('scorecard-modal').style.display = 'none';
};

async function handleCallEnd() {
  const duration = callSeconds;
  const scenario = currentScenario;
  const transcript = [...callTranscript];

  isConnected = false;
  stopTimer();
  showCallUi(false);
  callBtn.textContent = 'Start Voice Call';
  callBtn.className = 'btn btn-primary';
  callBtn.disabled = false;
  startCallWrap.style.display = 'flex';

  if (transcript.length < 4) return; // Too short to grade

  // Show loading modal
  const modal = document.getElementById('scorecard-modal');
  modal.innerHTML = `<div class="modal-overlay"><div class="modal-content"><div class="scoring-spinner"><div class="spinner"></div><p>Analyzing your call...</p></div></div></div>`;
  modal.style.display = 'block';

  const scores = await gradeCall(scenario, transcript, formatDuration(duration));

  const durStr = formatDuration(duration);
  if (scores) {
    const result = {
      date: new Date().toISOString(),
      scenario: scenario.product,
      company: scenario.company,
      duration: durStr,
      durationSec: duration,
      scores: scores,
      grade: scores.grade || 'C',
      transcript: transcript
    };
    saveCallResult(result);
    showScorecardModal(scores, scenario, durStr);
  } else {
    showScorecardModal(null, scenario, durStr);
  }
}

function formatDuration(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}

// ===== ANALYTICS =====
function renderAnalytics() {
  const history = getCallHistory();
  const el = document.getElementById('analytics-content');

  if (!history.length) {
    el.innerHTML = '<div class="empty-state">No calls yet. Complete a practice call to see your analytics!</div>';
    return;
  }

  // Stats
  const totalCalls = history.length;
  const scores = history.map(h => {
    if (!h.scores) return 0;
    const cats = ['opening','discovery','objection_handling','value_comm','closing','rules'];
    const maxes = [15,25,20,15,15,10];
    let total = 0;
    cats.forEach((c,i) => { total += Math.round(((h.scores[c]?.score||0)/5)*maxes[i]); });
    return total;
  });
  const avgScore = Math.round(scores.reduce((a,b) => a+b, 0) / scores.length);
  const bestScore = Math.max(...scores);

  // Streak: consecutive calls with grade B or better
  const goodGrades = ['A','A+','A-','B','B+','B-'];
  let streak = 0;
  for (const h of history) {
    if (goodGrades.includes(h.grade?.toUpperCase())) streak++;
    else break;
  }

  // Category averages
  const catKeys = ['opening','discovery','objection_handling','value_comm','closing','rules'];
  const catLabels = ['Opening','Discovery','Objection Handling','Value Comm','Closing','Rules'];
  const catMaxes = [15,25,20,15,15,10];
  const catAvgs = catKeys.map(k => {
    const vals = history.filter(h => h.scores?.[k]).map(h => h.scores[k].score);
    return vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : 0;
  });

  // Best/worst category
  const catPcts = catAvgs.map((v,i) => ({label: catLabels[i], pct: (v/5)*100, idx: i}));
  catPcts.sort((a,b) => b.pct - a.pct);
  const bestCat = catPcts[0];
  const worstCat = catPcts[catPcts.length - 1];

  // Grade distribution
  const gradeCounts = {A:0,B:0,C:0,D:0,F:0};
  history.forEach(h => {
    const g = (h.grade || 'F').charAt(0).toUpperCase();
    if (gradeCounts[g] !== undefined) gradeCounts[g]++;
  });

  // Last 5 calls trend
  const last5 = history.slice(0, 5).reverse();
  const last5scores = last5.map(h => {
    if (!h.scores) return 0;
    let t = 0;
    catKeys.forEach((c,i) => { t += Math.round(((h.scores[c]?.score||0)/5)*catMaxes[i]); });
    return t;
  });

  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${totalCalls}</div><div class="stat-label">Total Calls</div></div>
      <div class="stat-card"><div class="stat-value">${avgScore}</div><div class="stat-label">Avg Score</div></div>
      <div class="stat-card"><div class="stat-value">${bestScore}</div><div class="stat-label">Best Score</div></div>
      <div class="stat-card"><div class="stat-value">${streak}</div><div class="stat-label">Streak (B+)</div></div>
    </div>

    <div class="insight-row">
      <div class="insight-card">
        <div class="insight-label" style="color:var(--success)">💪 Best At</div>
        <div class="insight-value">${bestCat.label} <span style="font-size:0.75rem;color:var(--text2);font-weight:400">${Math.round(bestCat.pct)}%</span></div>
      </div>
      <div class="insight-card">
        <div class="insight-label" style="color:var(--danger)">📈 Needs Work</div>
        <div class="insight-value">${worstCat.label} <span style="font-size:0.75rem;color:var(--text2);font-weight:400">${Math.round(worstCat.pct)}%</span></div>
      </div>
    </div>

    <div class="radar-wrap">
      <div class="radar-title">Score Breakdown</div>
      <div class="radar-container">
        <svg viewBox="0 0 260 260" id="radar-svg"></svg>
      </div>
    </div>

    <div style="margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px">
      <div class="radar-title">Recent Trend (Last ${last5.length} Calls)</div>
      <div style="display:flex;align-items:flex-end;justify-content:center;gap:8px;height:80px;margin-top:8px">
        ${last5scores.map(s => {
          const h = Math.max(8, (s/100)*80);
          const color = s >= 80 ? '#34d399' : s >= 60 ? '#fbbf24' : '#f87171';
          return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:32px;height:${h}px;background:${color};border-radius:4px;opacity:0.8"></div><span style="font-size:0.65rem;color:var(--text2)">${s}</span></div>`;
        }).join('')}
      </div>
    </div>

    <div style="margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px">
      <div class="radar-title">Grade Distribution</div>
      <div class="grade-grid">
        ${['A','B','C','D','F'].map(g => `
          <div class="grade-chip">
            <div class="grade-letter grade-${g.toLowerCase()}">${gradeCounts[g]}</div>
            <div class="grade-count">${g}'s</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div style="margin-top:24px">
      <div class="section-title">Call History</div>
      <div class="history-table-wrap">
        <table class="history-table">
          <thead><tr><th>Date</th><th>Scenario</th><th>Duration</th><th>Score</th><th>Grade</th></tr></thead>
          <tbody>
            ${history.slice(0, 20).map(h => {
              const d = new Date(h.date);
              const dateStr = (d.getMonth()+1) + '/' + d.getDate();
              const gc = {A:'grade-a',B:'grade-b',C:'grade-c',D:'grade-d',F:'grade-f'}[(h.grade||'F').charAt(0).toUpperCase()] || 'grade-f';
              const sc = h.scores ? (() => {
                let t=0;catKeys.forEach((c,i)=>{t+=Math.round(((h.scores[c]?.score||0)/5)*catMaxes[i]);});return t;
              })() : '-';
              return `<tr><td>${dateStr}</td><td>${esc(h.scenario||h.company||'Custom')}</td><td>${h.duration||'-'}</td><td>${sc}</td><td class="${gc}" style="font-weight:700">${h.grade||'-'}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Draw radar chart
  drawRadar(catAvgs);
}

function drawRadar(values) {
  const svg = document.getElementById('radar-svg');
  if (!svg) return;
  const cx = 130, cy = 130, r = 100;
  const n = values.length;
  const labels = ['Opening','Discovery','Objections','Value','Closing','Rules'];

  // Grid rings
  let gridHTML = '';
  for (let ring = 1; ring <= 5; ring++) {
    const rr = (ring / 5) * r;
    let pts = [];
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
      pts.push(`${cx + rr * Math.cos(angle)},${cy + rr * Math.sin(angle)}`);
    }
    gridHTML += `<polygon points="${pts.join(' ')}" fill="none" stroke="#222" stroke-width="1"/>`;
  }

  // Axes
  let axesHTML = '';
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    axesHTML += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#222" stroke-width="1"/>`;
    // Labels
    const lx = cx + (r + 16) * Math.cos(angle);
    const ly = cy + (r + 16) * Math.sin(angle);
    const anchor = Math.abs(Math.cos(angle)) < 0.1 ? 'middle' : Math.cos(angle) > 0 ? 'start' : 'end';
    axesHTML += `<text x="${lx}" y="${ly}" fill="#71717a" font-size="10" text-anchor="${anchor}" dominant-baseline="central" font-family="Inter,sans-serif">${labels[i]}</text>`;
  }

  // Data polygon
  let dataPts = [];
  let dotsHTML = '';
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
    const v = (values[i] / 5) * r;
    const x = cx + v * Math.cos(angle);
    const y = cy + v * Math.sin(angle);
    dataPts.push(`${x},${y}`);
    dotsHTML += `<circle cx="${x}" cy="${y}" r="4" fill="#f97316"/>`;
  }

  svg.innerHTML = gridHTML + axesHTML + `<polygon points="${dataPts.join(' ')}" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="2"/>` + dotsHTML;
}

// ===== CALL LOGIC (preserved from original) =====
window.startCall = async function() {
  if (isConnected && client) {
    client.stopCall();
    // Don't reset yet - let close handler deal with it
    return;
  }
  if (!currentScenario) return;
  try {
    const s = currentScenario;
    callBtn.disabled = true;
    callBtn.textContent = 'Connecting...';

    // Reset transcript
    callTranscript = [];
    callStartTime = Date.now();

    showCallUi(true);
    transcriptEl.innerHTML = '';
    log('Connecting to ' + s.buyer + '...', 'sys');

    const resp = await fetch('https://api.retellai.com/v2/create-web-call', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + RETELL_KEY },
      body: JSON.stringify({
        agent_id: RETELL_AGENT,
        voice_id: s.voice || undefined,
        dynamic_variables: {
          product: s.product,
          company_name: s.company,
          company_description: s.companyDesc,
          buyer_persona: s.buyer + '. Personality: ' + s.buyerPersona,
          pain_points: s.painPoints,
          goal: s.goal,
          rules: s.rules,
          script: s.script,
          difficulty: s.difficulty
        }
      })
    });
    const data = await resp.json();
    if (!data.access_token) {
      log('Error: ' + JSON.stringify(data).substring(0, 300), 'sys');
      showCallUi(false);
      callBtn.disabled = false;
      callBtn.textContent = 'Start Voice Call';
      startCallWrap.style.display = 'flex';
      return;
    }

    log('Connected. Start pitching!', 'sys');

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop());
    } catch(micErr) {
      log('Microphone access denied: ' + micErr.message, 'sys');
      showCallUi(false);
      callBtn.disabled = false;
      callBtn.textContent = 'Start Voice Call';
      startCallWrap.style.display = 'flex';
      return;
    }

    const RC = window.RetellWebClient;
    if (!RC) {
      log('SDK not loaded', 'sys');
      showCallUi(false);
      callBtn.disabled = false;
      callBtn.textContent = 'Start Voice Call';
      startCallWrap.style.display = 'flex';
      return;
    }

    client = new RC();
    const buyerName = s.buyer.split(',')[0];
    client.on('agentTalk', (e) => { if(e.transcript) log('BUYER (' + buyerName + '): ' + e.transcript, 'buyer'); });
    client.on('userTalk', (e) => { if(e.transcript) log('YOU: ' + e.transcript, 'you'); });
    client.on('audioStarted', () => { log('Buyer is speaking...', 'sys'); });
    client.on('open', () => { log('Call connected', 'sys'); });
    client.on('close', () => {
      log('Call ended', 'sys');
      handleCallEnd();
    });
    client.on('error', (err) => {
      log('Error: ' + JSON.stringify(err), 'sys');
      handleCallEnd();
    });

    await client.startCall({ accessToken: data.access_token });
    isConnected = true;
    startTimer();
    startCallWrap.style.display = 'none';
  } catch(e) {
    log('Error: ' + e.message, 'sys');
    showCallUi(false);
    callBtn.disabled = false;
    callBtn.textContent = 'Start Voice Call';
    callBtn.className = 'btn btn-primary';
    startCallWrap.style.display = 'flex';
  }
};
