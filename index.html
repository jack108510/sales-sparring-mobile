<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitchForge - Sharpen your pitch. Close more deals.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#f97316;--primary-hover:#ea580c;--primary-dim:rgba(249,115,22,.12);--dark:#0c0a09;--card:#1c1917;--border:#292524;--text:#fafaf9;--muted:#a8a29e;--dimmed:#78716c;--green:#10b981;--green-dim:rgba(16,185,129,.12);--red:#ef4444;--red-dim:rgba(239,68,68,.12);--amber:#f59e0b;--amber-dim:rgba(245,158,11,.12);--user-bubble:#9a3412;--ai-bubble:#292524}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;line-height:1.5;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#app{min-height:100vh}
.page{display:none;opacity:0;transition:opacity .3s ease}.page.active{display:block;opacity:1}
.logo-text{font-weight:800;letter-spacing:-.02em}.logo-text .forge{background:linear-gradient(135deg,#f97316,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--dark);position:sticky;top:0;z-index:50}
.top-nav .logo-text{font-size:1.25rem;cursor:pointer}.nav-right{display:flex;align-items:center;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff}
.nav-name{font-size:.86rem;font-weight:600;color:var(--muted)}
.btn-logout{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--dimmed);font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}.btn-logout:hover{border-color:var(--red);color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:10px;font-weight:600;font-size:.95rem;cursor:pointer;font-family:inherit;transition:.15s;text-decoration:none;border:none}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-lg{padding:16px 32px;font-size:1.1rem;border-radius:12px}

/* Landing */
.landing-hero{padding:80px 24px 60px;text-align:center;max-width:800px;margin:0 auto}
.landing-hero .logo-text{font-size:3rem;margin-bottom:8px}
.landing-hero h1{font-size:3rem;font-weight:900;line-height:1.1;margin:24px 0 16px;letter-spacing:-.03em}
.landing-hero p{font-size:1.12rem;color:var(--muted);max-width:560px;margin:0 auto 32px;line-height:1.6}
.hero-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.landing-section{padding:60px 24px;max-width:1000px;margin:0 auto}
.landing-section h2{text-align:center;font-size:1.7rem;font-weight:800;margin-bottom:8px}
.section-sub{text-align:center;color:var(--muted);margin-bottom:36px;font-size:1rem}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.feature-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px;transition:.15s}.feature-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.feature-card h3{font-size:1.05rem;font-weight:700;margin-bottom:8px}.feature-card p{color:var(--muted);font-size:.9rem;line-height:1.6}
.feature-icon{width:42px;height:42px;border-radius:10px;background:var(--primary-dim);display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:1.2rem;color:var(--primary);font-weight:800}
.testimonials{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.testimonial{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
.testimonial p{font-style:italic;color:var(--muted);font-size:.9rem;line-height:1.6;margin-bottom:12px}
.testimonial-name{font-weight:600;font-size:.86rem}.testimonial-role{color:var(--dimmed);font-size:.78rem}
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;max-width:680px;margin:0 auto}
.price-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;text-align:center}
.price-card.featured{border-color:var(--primary);position:relative}
.price-card.featured::before{content:'Popular';position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:4px 14px;border-radius:20px;font-size:.75rem;font-weight:700}
.price-card h3{font-size:1.15rem;font-weight:700;margin-bottom:4px}
.price-card .price{font-size:2.2rem;font-weight:900;margin:10px 0}.price-card .price span{font-size:1rem;font-weight:400;color:var(--muted)}
.price-card .price-desc{color:var(--muted);font-size:.88rem;margin-bottom:18px;line-height:1.5}
.price-card ul{list-style:none;text-align:left;margin-bottom:22px}.price-card li{padding:5px 0;color:var(--muted);font-size:.86rem}
.price-card li::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin-right:10px;vertical-align:middle}
.landing-footer{border-top:1px solid var(--border);padding:36px 24px;text-align:center}
.footer-tagline{color:var(--dimmed);font-size:.85rem;margin:4px 0 16px}.footer-links{display:flex;gap:24px;justify-content:center;margin-bottom:16px}
.footer-links a{color:var(--muted);text-decoration:none;font-size:.86rem;font-weight:500}.footer-links a:hover{color:var(--primary)}
.footer-copy{color:var(--dimmed);font-size:.76rem}

/* Auth */
.auth-container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:34px;max-width:400px;width:100%}
.auth-card .logo-text{font-size:1.5rem;text-align:center;display:block;margin-bottom:4px}
.auth-tagline{text-align:center;color:var(--dimmed);font-size:.85rem;margin-bottom:26px}
.auth-tabs{display:flex;margin-bottom:22px;border-bottom:1px solid var(--border)}
.auth-tab{flex:1;padding:10px;text-align:center;font-weight:600;font-size:.88rem;color:var(--dimmed);cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;transition:.15s}
.auth-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.auth-form{display:none}.auth-form.active{display:block}
.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:600;font-size:.82rem;color:var(--muted);margin-bottom:5px}
.form-group input{width:100%;padding:11px 14px;background:var(--dark);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.92rem;font-family:inherit}
.form-group input:focus{outline:2px solid var(--primary);outline-offset:-1px}.form-group input::placeholder{color:var(--dimmed)}
.auth-submit{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}.auth-submit:hover{background:var(--primary-hover)}
.auth-switch{text-align:center;margin-top:14px;color:var(--dimmed);font-size:.85rem}.auth-switch a{color:var(--primary);cursor:pointer;font-weight:600;text-decoration:none}

/* Dashboard */
.dashboard{max-width:960px;margin:0 auto;padding:24px}
.dash-welcome{margin-bottom:28px}.dash-welcome h1{font-size:1.5rem;font-weight:800}.dash-welcome p{color:var(--muted);font-size:.92rem}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-card .stat-label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--dimmed);margin-bottom:5px}
.stat-card .stat-value{font-size:1.8rem;font-weight:800}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:28px}
.action-card{border-radius:14px;padding:26px;cursor:pointer;transition:.15s;text-decoration:none;display:block}
.action-card:hover{transform:translateY(-2px)}
.action-card.primary-action{background:linear-gradient(135deg,#9a3412,#f97316);border:1px solid rgba(249,115,22,.3)}
.action-card.secondary-action{background:var(--card);border:1px solid var(--border)}.action-card:hover.secondary-action{border-color:var(--primary)}
.action-card h3{font-size:1.15rem;font-weight:700;margin-bottom:5px}.action-card p{color:rgba(255,255,255,.7);font-size:.88rem}
.action-icon{font-size:1.6rem;margin-bottom:8px}
.recent-section{margin-bottom:28px}.recent-section h2{font-size:1.05rem;font-weight:700;margin-bottom:12px}
.call-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:8px}
.call-item-persona{font-weight:600;font-size:.88rem}.call-item-meta{font-size:.78rem;color:var(--dimmed)}
.call-item-score{font-weight:700;font-size:1rem}.call-item-duration{font-size:.76rem;color:var(--dimmed);text-align:right}
.empty-state{color:var(--dimmed);font-size:.9rem;text-align:center;padding:28px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.tip-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:28px}
.tip-section h3{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--amber);margin-bottom:6px}
.tip-section p{color:var(--muted);font-size:.9rem;line-height:1.6}

/* Setup */
.setup-page{max-width:620px;margin:0 auto;padding:24px}
.setup-tagline{color:var(--muted);text-align:center;margin-bottom:28px;font-size:.92rem}
.section{margin-bottom:22px}.section-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dimmed);margin-bottom:8px}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.preset-chip{padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:.8rem;font-weight:500;cursor:pointer;transition:.15s}
.preset-chip:hover,.preset-chip.active{border-color:var(--primary);color:var(--primary);background:var(--primary-dim)}
.field{margin-bottom:12px}.field label{display:block;font-weight:600;margin-bottom:5px;font-size:.82rem;color:var(--muted)}
.field textarea{width:100%;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.9rem;font-family:inherit;min-height:90px;resize:vertical;line-height:1.5}
.field textarea::placeholder{color:var(--dimmed)}.field textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}
.toggle-group{display:flex;gap:8px}
.toggle-btn{flex:1;padding:11px;background:var(--card);border:2px solid var(--border);border-radius:10px;color:var(--muted);font-weight:600;cursor:pointer;text-align:center;font-family:inherit;font-size:.86rem;transition:.15s}
.toggle-btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-dim)}.toggle-btn:hover{border-color:var(--primary)}
.btn-start{width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:14px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;transition:.15s}.btn-start:hover{background:var(--primary-hover);transform:translateY(-1px)}

/* Call */
.call-layout{display:flex;height:calc(100vh - 53px)}
.call-left{flex:0 0 60%;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.call-right{flex:0 0 40%;display:flex;flex-direction:column;overflow-y:auto;background:var(--dark)}
.call-header{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.call-header-left .label{font-size:.66rem;color:var(--dimmed);text-transform:uppercase;letter-spacing:.5px}
.call-header-left .value{font-weight:600;font-size:.85rem}
.timer{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary)}
.chat-area{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:.88rem;line-height:1.5;word-wrap:break-word;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.ai{align-self:flex-start;background:var(--ai-bubble);border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:var(--user-bubble);border-bottom-right-radius:4px}
.msg .sender{font-size:.68rem;font-weight:600;margin-bottom:2px;opacity:.7}.msg.user .sender{color:var(--primary)}
.typing{align-self:flex-start;color:var(--muted);font-style:italic;font-size:.82rem;padding:6px 0;display:flex;align-items:center;gap:8px}
.typing-dots span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce .6s ease infinite;display:inline-block;margin:0 1px}
.typing-dots span:nth-child(2){animation-delay:.15s}.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.input-area{padding:8px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--card);flex-shrink:0}
.input-area textarea{flex:1;padding:9px 12px;background:var(--dark);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;font-family:inherit;resize:none;height:44px;max-height:100px}
.input-area textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}.input-area textarea::placeholder{color:var(--dimmed)}
.send-btn{width:44px;height:44px;background:var(--primary);border:none;border-radius:10px;color:#fff;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.send-btn:hover{background:var(--primary-hover)}.send-btn:disabled{opacity:.4;cursor:not-allowed}
.end-call-bar{padding:6px 16px;flex-shrink:0}
.end-btn{width:100%;padding:9px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.82rem;transition:.15s}.end-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.coach-panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.coach-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dimmed);margin-bottom:4px}
.diff-meter-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.diff-meter-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.diff-meter-label span:first-child{font-size:.76rem;font-weight:600;color:var(--muted)}
.diff-num{font-size:1.5rem;font-weight:800;color:var(--primary)}.diff-max{font-size:.82rem;color:var(--dimmed)}
.diff-bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.diff-bar-fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.4,0,.2,1),background .6s ease}
.diff-desc{font-size:.74rem;color:var(--dimmed);margin-top:6px}
.next-move{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.nm-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--amber);margin-bottom:4px}
.nm-text{font-size:.88rem;font-weight:600}
.alert{padding:9px 12px;border-radius:10px;font-size:.82rem;font-weight:500;animation:alertIn .3s ease}
@keyframes alertIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
.alert.warning{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.alert.praise{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.alert.tip{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.mini-scores{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.ms-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ms-label{font-size:.68rem;color:var(--dimmed);font-weight:500}
.ms-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.ms-bar-fill{height:100%;border-radius:2px;transition:width .5s ease;background:var(--primary)}
.ms-bar-fill.low{background:var(--red)}.ms-bar-fill.mid{background:var(--amber)}.ms-bar-fill.high{background:var(--green)}
.coach-loading{display:flex;align-items:center;gap:8px;color:var(--dimmed);font-size:.78rem;padding:4px 0}
.spinner-sm{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Debrief */
.debrief-page{max-width:680px;margin:0 auto;padding:24px}
.debrief-header{text-align:center;margin-bottom:24px}
.debrief-header h1{font-size:1.7rem;font-weight:800}.debrief-header h1 span{color:var(--primary)}
.debrief-header .sub{color:var(--muted);font-size:.88rem}
.score-hero{text-align:center;margin:10px 0 22px}
.big-num{font-size:4.2rem;font-weight:800;line-height:1}.out-of{font-size:1.2rem;color:var(--muted);font-weight:400}
.grade{font-size:1rem;font-weight:700;margin-top:4px}.diff-range{color:var(--muted);font-size:.82rem;margin-top:5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card h3{font-size:.9rem;font-weight:700;margin-bottom:8px}
.category{display:flex;align-items:center;gap:8px;margin-bottom:7px}.category:last-child{margin-bottom:0}
.cat-name{width:150px;font-size:.78rem;font-weight:500;color:var(--muted);flex-shrink:0}
.bar-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.cat-score{width:26px;text-align:right;font-weight:700;font-size:.86rem}
.replay-msg{padding:7px 11px;border-radius:8px;margin-bottom:3px;font-size:.84rem;line-height:1.5}
.replay-msg.user-msg{background:rgba(154,52,18,.2)}.replay-msg.ai-msg{background:rgba(41,37,36,.5)}
.replay-sender{font-size:.66rem;font-weight:600;color:var(--dimmed);margin-bottom:1px}
.replay-annotation{font-size:.76rem;padding:5px 9px;border-radius:6px;margin:2px 0 5px 9px;font-weight:500}
.replay-annotation.good{background:var(--green-dim);color:var(--green);border-left:3px solid var(--green)}
.replay-annotation.missed{background:var(--amber-dim);color:var(--amber);border-left:3px solid var(--amber)}
.replay-annotation.mistake{background:var(--red-dim);color:var(--red);border-left:3px solid var(--red)}
.fb-list{list-style:none;padding:0}.fb-list li{padding:4px 0;font-size:.86rem;color:var(--muted);padding-left:16px;position:relative}
.fb-list li::before{content:'';position:absolute;left:0;top:12px;width:5px;height:5px;border-radius:50%}
.fb-list.green li::before{background:var(--green)}.fb-list.red li::before{background:var(--red)}
.fb-quote{padding:9px 13px;border-left:3px solid var(--primary);background:var(--primary-dim);border-radius:0 8px 8px 0;margin:5px 0;font-size:.86rem;font-style:italic}
.fb-quote.bad{border-left-color:var(--red);background:var(--red-dim)}
.tip-box{padding:11px 15px;background:var(--amber-dim);border:1px solid rgba(245,158,11,.25);border-radius:10px;font-size:.88rem;color:var(--amber);font-weight:500}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;padding:13px;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.88rem;transition:.15s}
.btn-primary-action{background:var(--primary);color:#fff;border:none}.btn-primary-action:hover{background:var(--primary-hover)}
.btn-secondary-action{background:transparent;border:2px solid var(--border);color:var(--text)}.btn-secondary-action:hover{border-color:var(--primary);color:var(--primary)}
.btn-tertiary-action{background:transparent;border:2px solid var(--border);color:var(--muted)}.btn-tertiary-action:hover{border-color:var(--muted);color:var(--text)}

/* Loading */
.loading-overlay{position:fixed;inset:0;background:rgba(12,10,9,.9);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:14px}
.loading-overlay.show{display:flex}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
.loading-text{color:var(--muted);font-size:.9rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:11px 22px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:200;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(max-width:768px){
  .call-layout{flex-direction:column}
  .call-left{flex:none;height:55vh;border-right:none;border-bottom:1px solid var(--border)}
  .call-right{flex:1;height:45vh;overflow-y:auto}
  .msg{max-width:90%}.cat-name{width:110px;font-size:.72rem}
  .big-num{font-size:3.2rem}.actions{flex-direction:column}
  .landing-hero h1{font-size:2.2rem}.landing-hero .logo-text{font-size:2.2rem}
  .ms-grid{grid-template-columns:1fr}
  .hero-buttons{flex-direction:column;align-items:center}
  .pricing-grid,.testimonials,.features-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <!-- Pages injected by router -->
</div>

<div id="loading-overlay" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Analyzing your performance...</div>
</div>

<script>
// ===== DATA =====
const PRODUCTS = [

const BUYERS = [

  {id:'price',label:'The Price Shopper',name:'Jennifer Park',desc:'Operations manager at a logistics company. Strict budget, 5 quotes on her desk. Only cares about the bottom line. Negotiates hard, mentions competitors.'},
  {id:'friendly',label:'The Friendly Time-Waster',name:'Bob Williams',desc:'Owner of a family restaurant. Loves chatting, seems interested in everything, but never commits. Always "needs to think about it" or "talk to my partner."'},
  {id:'gatekeeper',label:'The Gatekeeper',name:'Lisa',desc:'Office manager at a law firm. Not the decision maker -- screens calls for the senior partner. Needs convincing this is worth the partner\'s time.'},

  {id:'loyal',label:'The Loyal Customer',name:'Carol',desc:'Practice manager at a vet clinic. Used same provider for 8 years, very happy. Needs a compelling reason to even consider switching.'},
  {id:'custom',label:'Custom',name:'Custom Buyer',desc:''}
];

const SCORE_CATS = [
  {key:'rapport',label:'Rapport'},{key:'discovery',label:'Discovery'},{key:'objection',label:'Objections'},
  {key:'product',label:'Product'},{key:'closing',label:'Closing'},{key:'communication',label:'Pacing'}
];

const DIFF_DESC = {
  1:'Somewhat interested, asks basic questions, raises simple objections',
  2:'Polite and curious, easy to engage',
  3:'Warming up, starting to ask real questions',
  4:'Busy and skeptical, asks pointed questions',
  5:'Guarded but willing to listen if you make good points',
  6:'Analytical, wants details and comparisons',
  7:'Very skeptical, compares to competitors, challenges claims',
  8:'Pushing back hard, tests your knowledge',
  9:'Hostile, trying to end the call, argues every point',
  10:'Nearly impossible to close, attacks every claim'
};

const TIPS = [
  "Ask open-ended questions to uncover the prospect's real pain points before pitching.",
  "Mirror the prospect's language and pace to build rapport faster.",
  "Always confirm the next step before ending a call -- never leave it open-ended.",
  "When hit with an objection, acknowledge it before countering. Don't get defensive.",
  "Use specific numbers and case studies instead of vague claims.",
  "Listen more than you talk. The best salespeople talk 30% of the time.",
  "Name-drop similar clients in their industry to build credibility.",
  "Create urgency by tying your solution to a deadline or pain point they mentioned.",
  "Rehearse handling the top 5 objections for your product until they're automatic.",
  "Ask 'What would need to happen for you to move forward?' to surface hidden objections."
];

// ===== STATE =====
let S = {
  productPreset:null,productDesc:'',pitchScript:'',buyerPreset:null,buyerName:'',buyerDesc:'',
  startDifficulty:3,currentDifficulty:3,difficultyHistory:[3],level:'intermediate',
  messages:[],timerInterval:null,seconds:0,
  runningScores:{rapport:5,discovery:5,objection:5,product:5,closing:5,communication:5},
  buyerBusy:false,coachBusy:false
};

// ===== STORAGE =====
function getUser(){try{return JSON.parse(localStorage.getItem('pitchforge_user'))}catch(e){return null}}
function setUser(u){localStorage.setItem('pitchforge_user',JSON.stringify(u))}
function getCalls(){try{return JSON.parse(localStorage.getItem('pitchforge_calls'))||[]}catch(e){return[]}}
function addCall(c){const calls=getCalls();calls.unshift(c);if(calls.length>50)calls.length=50;localStorage.setItem('pitchforge_calls',JSON.stringify(calls))}
function saveSetup(){localStorage.setItem('pitchforge_setup',JSON.stringify({product:S.productPreset,productDesc:S.productDesc,pitch:S.pitchScript,persona:S.buyerPreset,difficulty:S.startDifficulty,level:S.level}))}
function loadSetup(){try{return JSON.parse(localStorage.getItem('pitchforge_setup'))||{}}catch(e){return{}}}

// ===== ROUTER =====
function navigate(hash){
  if(!hash || hash==='#/' || hash==='#/landing') hash='#/landing';
  if((hash==='#/dashboard'||hash==='#/setup'||hash==='#/call'||hash==='#/debrief') && !getUser()) hash='#/signup';
  window.location.hash=hash;
}

function getRoute(){return window.location.hash||'#/landing'}

function route(){
  const r=getRoute();
  const app=document.getElementById('app');
  let html='';
  if(r==='#/landing'||r==='#/'||r==='') html=pageLanding();
  else if(r==='#/signup'||r==='#/login') html=pageAuth();
  else if(r==='#/dashboard') html=pageDashboard();
  else if(r==='#/setup') html=pageSetup();
  else if(r==='#/call') html=pageCall();
  else if(r==='#/debrief') html=pageDebrief();
  else html=pageLanding();
  app.innerHTML=html;
  // Trigger opacity
  requestAnimationFrame(()=>{const p=app.querySelector('.page');if(p)p.classList.add('active')});
  postRoute(r);
}

function postRoute(r){
  if(r==='#/setup') initSetup();
  if(r==='#/call') initCall();
}

window.addEventListener('hashchange',route);
window.addEventListener('load',route);

// ===== PAGE TEMPLATES =====
function logoHTML(size){
  size=size||'1.25rem';
  return `<span class="logo-text" style="font-size:${size}" onclick="navigate('#/landing')">Pitch<span class="forge">Forge</span></span>`;
}

function navHTML(showUser){
  if(!showUser) return `<div class="top-nav">${logoHTML()}<div style="width:80px"></div></div>`;
  const u=getUser();
  const initials=u?u.name.charAt(0).toUpperCase():'U';
  return `<div class="top-nav">${logoHTML()}<div class="nav-right"><div style="display:flex;align-items:center;gap:8px"><div class="avatar">${initials}</div><span class="nav-name">${u?u.name:''}</span></div><button class="btn-logout" onclick="doLogout()">Log Out</button></div></div>`;
}

  return `<div class="page">
  <div class="auth-container">
    <div class="auth-card">
      ${logoHTML('1.5rem')}
      <div class="auth-tagline">Sharpen your pitch. Close more deals.</div>
      <div class="auth-tabs">
        <button class="auth-tab ${tab==='signup'?'active':''}" onclick="navigate('#/signup')">Sign Up</button>

function doSignup(){
  const name=document.getElementById('signup-name').value.trim();
  const email=document.getElementById('signup-email').value.trim();
  if(!name||!email){showToast('Please fill in all fields');return}
  setUser({name,email});
  navigate('#/dashboard');
}

function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  if(!email){showToast('Please enter your email');return}
  const existing=getUser();
  setUser({name:existing?existing.name:email.split('@')[0],email});
  navigate('#/dashboard');
}

function doLogout(){
  localStorage.removeItem('pitchforge_user');
  navigate('#/landing');
}

// Dashboard
function pageDashboard(){
  const u=getUser();
  const calls=getCalls();
  const weekCalls=calls.filter(c=>{const d=new Date(c.date);const now=new Date();return (now-d)<7*86400000});
  const avgScore=weekCalls.length?Math.round(weekCalls.reduce((s,c)=>s+c.score,0)/weekCalls.length):0;
  const bestScore=weekCalls.length?Math.max(...weekCalls.map(c=>c.score)):0;
  const today=new Date();let streak=0;for(let i=0;i<365;i++){const d=new Date(today-i*86400000).toISOString().slice(0,10);if(calls.some(c=>c.date===d))streak++;else break}
  const tip=TIPS[Math.floor(Date.now()/86400000)%TIPS.length];
  const recent=calls.slice(0,5);

  return `<div class="page">
  ${navHTML(true)}
  <div class="dashboard">
    <div class="dash-welcome"><h1>Welcome back, ${u.name}</h1><p>Your stats this week:</p></div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Calls Completed</div><div class="stat-value primary">${weekCalls.length}</div></div>
      <div class="stat-card"><div class="stat-label">Average Score</div><div class="stat-value">${avgScore}/100</div></div>
      <div class="stat-card"><div class="stat-label">Best Score</div><div class="stat-value green">${bestScore}/100</div></div>
      <div class="stat-card"><div class="stat-label">Current Streak</div><div class="stat-value primary">${streak} days</div></div>
    </div>
    <div class="quick-actions">
      <div class="action-card primary-action" onclick="navigate('#/setup')">
        <div class="action-icon">&#9742;</div>
        <h3>Start Practice Call</h3>
        <p>Choose your product, buyer, and difficulty level</p>
      </div>
      <div class="action-card secondary-action" onclick="navigate('#/setup')">
        <div class="action-icon">&#9776;</div>
        <h3>Review Past Calls</h3>
        <p>See your recent call history and scores below</p>
      </div>
    </div>
    <div class="tip-section"><h3>Coach's Tip of the Day</h3><p>${tip}</p></div>
    <div class="recent-section"><h2>Recent Activity</h2>
      ${recent.length?recent.map(c=>`<div class="call-item"><div><div class="call-item-persona">${c.persona}</div><div class="call-item-meta">${c.product} -- ${c.date}</div></div><div style="text-align:right"><div class="call-item-score" style="color:${c.score>=70?'var(--green)':c.score>=50?'var(--amber)':'var(--red)'}">${c.score}/100</div><div class="call-item-duration">${c.duration}</div></div></div>`).join(''):`<div class="empty-state">No calls yet. Start your first practice call to see your history here.</div>`}
    </div>
  </div>
</div>`;
}

// Setup
function pageSetup(){
  return `<div class="page">
  ${navHTML(true)}

    </div>
    <div style="height:30px"></div>
  </div>
</div>`;

function initSetup(){
  const pp=document.getElementById('product-presets');
  if(pp) pp.innerHTML=PRODUCTS.map(p=>`<div class="preset-chip" data-id="${p.id}" onclick="selectProduct('${p.id}')">${p.label}</div>`).join('');
  const bp=document.getElementById('buyer-presets');
  if(bp) bp.innerHTML=BUYERS.map(b=>`<div class="preset-chip" data-id="${b.id}" onclick="selectBuyer('${b.id}')">${b.label}</div>`).join('');
  const saved=loadSetup();
  if(saved.product) selectProduct(saved.product);
  if(saved.persona) selectBuyer(saved.persona);
  if(saved.difficulty) setDiff(saved.difficulty);
  if(saved.level) setLevel(saved.level);
  if(saved.pitch) document.getElementById('pitch-script').value=saved.pitch;
}

function selectProduct(id){
  S.productPreset=id;
  document.querySelectorAll('#product-presets .preset-chip').forEach(c=>c.classList.toggle('active',c.dataset.id===id));
  const p=PRODUCTS.find(x=>x.id===id);
  const cd=document.getElementById('product-custom');
  if(id==='custom'){cd.style.display='block';S.productDesc='';}
  else{cd.style.display='none';S.productDesc=p.desc;}
}

function selectBuyer(id){
  S.buyerPreset=id;
  document.querySelectorAll('#buyer-presets .preset-chip').forEach(c=>c.classList.toggle('active',c.dataset.id===id));
  const b=BUYERS.find(x=>x.id===id);
  const cd=document.getElementById('buyer-custom');
  if(id==='custom'){cd.style.display='block';S.buyerName='Custom Buyer';S.buyerDesc='';}
  else{cd.style.display='none';S.buyerName=b.name;S.buyerDesc=b.desc;}
}

function setDiff(v){
  S.startDifficulty=v==='auto'?'auto':Number(v);
  document.querySelectorAll('[data-diff]').forEach(b=>b.classList.toggle('active',b.dataset.diff==v));
}

function setLevel(v){
  S.level=v;
  document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',b.dataset.level===v));
}

// Call
function pageCall(){
  return `<div class="page" style="display:block;opacity:1">
  ${navHTML(true)}
  <div class="call-layout">
    <div class="call-left">

          <div class="diff-meter-label"><span>Difficulty</span><div><span class="diff-num" id="diff-num">3</span><span class="diff-max">/10</span></div></div>
          <div class="diff-bar"><div class="diff-bar-fill" id="diff-bar-fill" style="width:30%;background:linear-gradient(90deg,#10b981,#f59e0b)"></div></div>
          <div class="diff-desc" id="diff-desc">Somewhat interested, basic questions</div>
        </div>
        <div class="next-move"><div class="nm-label">Next Move</div><div class="nm-text" id="next-move-text">Start the conversation with your prospect</div></div>
        <div id="coach-alerts"></div>
        <div id="coach-tip"></div>
        <div class="mini-scores"><div class="coach-title" style="margin-bottom:6px">Running Scores</div><div class="ms-grid" id="ms-grid"></div></div>
        <div class="coach-loading" id="coach-loading" style="display:none"><div class="spinner-sm"></div><span>Coach is analyzing...</span></div>
      </div>
    </div>
  </div>
</div>`;
}

async function initCall(){
  if(S.productPreset==='custom'||!S.productPreset){
    S.productDesc=document.getElementById('product-desc')?.value?.trim()||S.productDesc;
    if(!S.productDesc){navigate('#/setup');return}
  }
  if(S.buyerPreset==='custom'||!S.buyerPreset){
    S.buyerDesc=document.getElementById('buyer-desc')?.value?.trim()||S.buyerDesc;
    if(!S.buyerDesc){navigate('#/setup');return}
  }
  S.pitchScript=document.getElementById('pitch-script')?.value?.trim()||'';
  S.startDifficulty=S.startDifficulty==='auto'?3:Number(S.startDifficulty);
  S.currentDifficulty=S.startDifficulty;
  S.difficultyHistory=[S.startDifficulty];
  S.messages=[];S.seconds=0;
  S.runningScores={rapport:5,discovery:5,objection:5,product:5,closing:5,communication:5};
  S.buyerBusy=false;S.coachBusy=false;
  saveSetup();

  const pl=document.getElementById('call-product-label');
  const bl=document.getElementById('call-buyer-label');
  if(pl) pl.textContent=S.productPreset==='custom'?'Custom':(PRODUCTS.find(p=>p.id===S.productPreset)?.label||'Product');
  if(bl) bl.textContent=S.buyerName;

  document.getElementById('ms-grid').innerHTML=SCORE_CATS.map(c=>`<div><div class="ms-label">${c.label}</div><div class="ms-bar"><div class="ms-bar-fill" id="ms-${c.key}" style="width:50%"></div></div></div>`).join('');
  updateDifficulty(S.currentDifficulty);
  updateMiniScores(S.runningScores);

  clearInterval(S.timerInterval);
  updateTimer();
  S.timerInterval=setInterval(()=>{S.seconds++;updateTimer()},1000);

  // Get buyer opening
  S.buyerBusy=true;
  showTyping(true);
  try{
    const opening=await callAI([{role:'system',content:buildBuyerPrompt()},{role:'user',content:'The salesperson has just called you. Introduce yourself briefly (1-2 sentences) and set the scene. Wait for them to pitch. Keep it short and natural.'}]);
    removeTyping();addChatMsg('ai',opening);S.messages.push({role:'assistant',content:opening});
  }catch(e){
    removeTyping();addChatMsg('ai','Hello? Who is this?');S.messages.push({role:'assistant',content:'Hello? Who is this?'});
  }
  S.buyerBusy=false;

  // Wire input
  const inp=document.getElementById('msg-input');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  inp.addEventListener('input',function(){this.style.height='44px';this.style.height=Math.min(this.scrollHeight,100)+'px'});
}

function buildBuyerPrompt(){
  const dd=DIFF_DESC[S.currentDifficulty]||'';
  const pc=S.pitchScript?`\nThe salesperson's pitch/script context: "${S.pitchScript}"\n`:'';
  return `You are ${S.buyerName}. ${S.buyerDesc}\n\nYou are receiving a sales call about: ${S.productDesc}\n\nCurrent difficulty level: ${S.currentDifficulty}/10. At this level: ${dd}.\n${pc}\nRules:\n- Stay in character at all times\n- Respond naturally as this person would\n- Keep responses to 2-4 sentences\n- React to what the salesperson actually says, not generic responses\n- If they're doing well, raise your guard. If they're struggling, give slight openings.\n- Never break character to give feedback`;
}

function buildCoachPrompt(){
  const ch=S.messages.map(m=>(m.role==='user'?'Salesperson: ':'Buyer: ')+m.content).join('\n');
  const lg=S.level==='beginner'?'The salesperson is a beginner — give more detailed guidance and encouragement.':S.level==='advanced'?'The salesperson is advanced — be subtle and strategic in coaching.':'The salesperson is at intermediate level.';
  return `You are an expert sales coach monitoring a live sales call. The salesperson is selling: ${S.productDesc}\n\nThe buyer is: ${S.buyerName}, ${S.buyerDesc}\n\nThe salesperson's level: ${S.level}. ${lg}\n\nHere is the conversation so far:\n${ch}\n\nAnalyze the last exchange and provide coaching in this EXACT JSON format (no markdown, just raw JSON):\n{"difficulty_adjustment": 0, "current_difficulty": ${S.currentDifficulty}, "next_move": "one specific suggestion for what to do next (5-10 words)", "warning": "a warning if relevant, or null", "praise": "a specific praise if relevant, or null", "tip": "a contextual tip based on what's happening (1 sentence)", "running_scores": {"rapport": 5, "discovery": 5, "objection": 5, "product": 5, "closing": 5, "communication": 5}}\n\nBe specific. Reference what they actually said. Scores are 1-10. difficulty_adjustment is -2 to +2 based on how well they're performing.`;
}

async function callAI(messages){
  const resp=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,model:'openai',seed:Math.floor(Math.random()*99999)})});
  if(!resp.ok)throw new Error('API error '+resp.status);
  const data=await resp.json();
  return data.choices?.[0]?.message?.content||data.text||'';
}

function updateTimer(){
  const el=document.getElementById('timer');
  if(el) el.textContent=String(Math.floor(S.seconds/60)).padStart(2,'0')+':'+String(S.seconds%60).padStart(2,'0');
}

function addChatMsg(role,text){
  const chat=document.getElementById('chat');
  if(!chat)return;
  const div=document.createElement('div');
  div.className='msg '+(role==='ai'?'ai':'user');
  div.innerHTML=`<div class="sender">${role==='ai'?S.buyerName:'You'}</div><div>${escHtml(text)}</div>`;
  chat.appendChild(div);chat.scrollTop=chat.scrollHeight;
}

function showTyping(show){
  removeTyping();
  if(show){
    const chat=document.getElementById('chat');if(!chat)return;
    const div=document.createElement('div');div.className='typing';div.id='typing-indicator';
    div.innerHTML=`${S.buyerName} is thinking... <span class="typing-dots"><span></span><span></span><span></span></span>`;
    chat.appendChild(div);chat.scrollTop=chat.scrollHeight;
  }
}

function removeTyping(){const t=document.getElementById('typing-indicator');if(t)t.remove()}

function escHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}

function updateMiniScores(scores){
  if(!scores)return;
  S.runningScores={...S.runningScores,...scores};
  SCORE_CATS.forEach(c=>{
    const v=S.runningScores[c.key]||5;
    const el=document.getElementById('ms-'+c.key);
    if(el){el.style.width=(v*10)+'%';el.className='ms-bar-fill'+(v<=4?' low':v<=6?' mid':' high')}
  });
}

function updateDifficulty(val){
  val=Math.max(1,Math.min(10,Math.round(val)));
  S.currentDifficulty=val;S.difficultyHistory.push(val);
  const n=document.getElementById('diff-num');if(n)n.textContent=val;
  const f=document.getElementById('diff-bar-fill');
  if(f){f.style.width=(val*10)+'%';f.style.background=val<=4?'linear-gradient(90deg,#10b981,#f59e0b)':val<=7?'linear-gradient(90deg,#f59e0b,#f97316)':'linear-gradient(90deg,#f97316,#ef4444)'}
  const d=document.getElementById('diff-desc');if(d)d.textContent=DIFF_DESC[val]||'';
}

function setCoachAlerts(data){
  const el=document.getElementById('coach-alerts');if(el)el.innerHTML='';
  if(data.warning&&el)el.innerHTML+=`<div class="alert warning">${data.warning}</div>`;
  if(data.praise&&el)el.innerHTML+=`<div class="alert praise">${data.praise}</div>`;
  const tip=document.getElementById('coach-tip');
  if(tip)tip.innerHTML=data.tip?`<div class="alert tip">${data.tip}</div>`:'';
  if(data.next_move){const nm=document.getElementById('next-move-text');if(nm)nm.textContent=data.next_move}
}

async function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text||S.buyerBusy)return;
  input.value='';input.style.height='44px';
  addChatMsg('user',text);
  S.messages.push({role:'user',content:text});
  document.getElementById('send-btn').disabled=true;
  S.buyerBusy=true;
  showTyping(true);
  document.getElementById('coach-loading').style.display='flex';

  const buyerP=callAI([{role:'system',content:buildBuyerPrompt()},...S.messages]).catch(()=>'Hmm, sorry, can you repeat that?');
  const coachP=callAI([{role:'system',content:buildCoachPrompt()},{role:'user',content:'Analyze the last exchange and provide coaching JSON now.'}]).catch(()=>null);
  const [buyerReply,coachRaw]=await Promise.all([buyerP,coachP]);

  removeTyping();addChatMsg('ai',buyerReply);S.messages.push({role:'assistant',content:buyerReply});
  document.getElementById('coach-loading').style.display='none';

  if(coachRaw){
    try{const j=coachRaw.match(/\{[\s\S]*\}/)?.[0];if(j){const c=JSON.parse(j);if(c.difficulty_adjustment)updateDifficulty(S.currentDifficulty+c.difficulty_adjustment);if(c.running_scores)updateMiniScores(c.running_scores);setCoachAlerts(c)}}catch(e){}
  }

  S.buyerBusy=false;
  document.getElementById('send-btn').disabled=false;
  input.focus();
}

async function startVoiceCall(){
  const phoneEl=document.getElementById('phone-input');
  const statusEl=document.getElementById('voice-status');
  let phone=phoneEl.value.replace(/[^0-9+]/g,'');
  if(!phone||phone.length<10){statusEl.textContent='Enter a valid phone number';statusEl.style.color='#ef4444';return}
  if(!phone.startsWith('+'))phone='+1'+phone;
  if(!S.productDesc&&!S.productPreset){statusEl.textContent='Select a product first';statusEl.style.color='#ef4444';return}
  if(!S.buyerDesc&&!S.buyerPreset){statusEl.textContent='Select a buyer persona first';statusEl.style.color='#ef4444';return}

  const product=PRODUCTS.find(x=>x.id===S.productPreset);
  const buyer=BUYERS.find(x=>x.id===S.buyerPreset);
  const productName=product?product.label:S.productDesc.substring(0,80);
  const buyerPersona=S.buyerDesc||buyer.description;
  const diff=S.startDifficulty==='auto'?5:Number(S.startDifficulty);

  statusEl.textContent='Calling you now...';statusEl.style.color='#f97316';

  try{
    const resp=await fetch('https://api.retellai.com/v2/create-phone-call',{
      method:'POST',
      headers:{'Authorization':'Bearer key_c833df9a891bacfc002cf8714c0c','Content-Type':'application/json'},
      body:JSON.stringify({
        from_number:'+12063505569',
        to_number:phone,
        override_agent_id:'agent_2d2969f4f54ab3192ceaf4ab5e',
        metadata:{product:productName,buyer_persona:buyerPersona,difficulty:String(diff)}
      })
    });
    const data=await resp.json();
    if(resp.ok&&data.call_id){
      statusEl.textContent='Call connected! Pick up your phone. Call ID: '+data.call_id;
      statusEl.style.color='#10b981';
      addCall({date:new Date().toISOString().split('T')[0],persona:buyer?buyer.label:'Custom',product:productName,score:0,grade:'-',duration:'Voice',difficulty_peak:diff,type:'voice',call_id:data.call_id});
    }else{
      statusEl.textContent='Error: '+(data.error_message||'Could not connect call');
      statusEl.style.color='#ef4444';
    }
  }catch(e){
    statusEl.textContent='Connection failed. Try again.';
    statusEl.style.color='#ef4444';
  }
}

async function endCall(){
  clearInterval(S.timerInterval);
  document.getElementById('loading-overlay').classList.add('show');
  document.getElementById('loading-text').textContent='Analyzing your performance...';
  try{const score=await getScore();window._lastScore=score}catch(e){window._lastScore=fallbackScore()}
  document.getElementById('loading-overlay').classList.remove('show');

  // Save call result
  const sc=window._lastScore;
  const dur=Math.floor(S.seconds/60)+':'+String(S.seconds%60).padStart(2,'0');
  addCall({date:new Date().toISOString().slice(0,10),persona:S.buyerName,product:PRODUCTS.find(p=>p.id===S.productPreset)?.label||'Custom',score:sc.overall_score,grade:sc.grade,duration:dur,difficulty_peak:sc.difficulty_peak||S.currentDifficulty});

  navigate('#/debrief');
}

async function getScore(){
  const tr=S.messages.map(m=>(m.role==='user'?'Salesperson: ':'Buyer: ')+m.content).join('\n');
  const prompt=`You are a sales coach grading a completed sales call.\n\nProduct: ${S.productDesc}\nBuyer: ${S.buyerName}, ${S.buyerDesc}\nSalesperson level: ${S.level}\nFinal difficulty reached: ${S.currentDifficulty}\n\nFull conversation:\n${tr}\n\nGrade the call. Return ONLY valid JSON (no markdown):\n{"overall_score": 75, "grade": "B", "difficulty_start": ${S.startDifficulty}, "difficulty_peak": ${Math.max(...S.difficultyHistory)}, "scores": {"rapport":7,"discovery":5,"objection":6,"product":8,"closing":4,"communication":7}, "strengths": ["specific thing 1", "specific thing 2", "specific thing 3"], "weaknesses": ["specific thing 1", "specific thing 2", "specific thing 3"], "best_moment": "quote their best line", "worst_moment": "quote their worst line", "tip": "one actionable tip", "annotations": [{"message_index": 0, "type": "good", "note": "explanation"}]}\n\nmessage_index is 0-based. type is "good", "missed", or "mistake". Provide 4-8 annotations. Be specific.`;
  const raw=await callAI([{role:'system',content:prompt},{role:'user',content:'Provide the scoring JSON now.'}]);
  const j=raw.match(/\{[\s\S]*\}/)?.[0];if(!j)throw new Error('No JSON');return JSON.parse(j);
}

function fallbackScore(){
  return{overall_score:50,grade:'C',difficulty_start:S.startDifficulty,difficulty_peak:S.currentDifficulty,scores:{rapport:5,discovery:5,objection:5,product:5,closing:5,communication:5},strengths:['Completed the call'],weaknesses:['Needs more practice'],best_moment:'',worst_moment:'',tip:'Focus on asking open-ended discovery questions.',annotations:[]};
}

// Debrief
function pageDebrief(){
  const sc=window._lastScore||fallbackScore();
  const s=sc.scores||{};
  const ov=sc.overall_score||50;
  const col=ov>=70?'var(--green)':ov>=50?'var(--amber)':'var(--red)';
  const peak=sc.difficulty_peak||S.currentDifficulty;
  const start=sc.difficulty_start||S.startDifficulty;

  const cats=[
    {key:'rapport',label:'Rapport Building'},{key:'discovery',label:'Discovery & Needs'},
    {key:'objection',label:'Objection Handling'},{key:'product',label:'Product Knowledge'},
    {key:'closing',label:'Closing Technique'},{key:'communication',label:'Communication & Pacing'}
  ];

  const bars=cats.map(c=>{
    const v=s[c.key]||5;const pct=v*10;
    const bc=v>=7?'var(--green)':v>=5?'var(--amber)':'var(--red)';
    return`<div class="category"><span class="cat-name">${c.label}</span><div class="bar-track"><div class="bar-fill" style="width:0%;background:${bc}" data-target="${pct}"></div></div><span class="cat-score">${v}</span></div>`;
  }).join('');

  const ann=sc.annotations||[];
  const amap={};ann.forEach(a=>{if(a.message_index!==undefined)amap[a.message_index]=a});

  let replay='';
  S.messages.forEach((m,i)=>{
    const u=m.role==='user';
    replay+=`<div class="replay-msg ${u?'user-msg':'ai-msg'}"><div class="replay-sender">${u?'You':S.buyerName}</div>${escHtml(m.content)}</div>`;
    if(amap[i]){const a=amap[i];replay+=`<div class="replay-annotation ${a.type==='good'?'good':a.type==='missed'?'missed':'mistake'}">${a.note}</div>`}
  });

  const strengths=(sc.strengths||[]).map(x=>`<li>${x}</li>`).join('');
  const weaknesses=(sc.weaknesses||[]).map(x=>`<li>${x}</li>`).join('');
  const best=sc.best_moment?`<div class="fb-quote">${escHtml(sc.best_moment)}</div>`:'';
  const worst=sc.worst_moment?`<div class="fb-quote bad">${escHtml(sc.worst_moment)}</div>`:'';

  const maxH=36;
  const curve=S.difficultyHistory.map((d,i)=>{
    const h=(d/10)*maxH;
    return`<div style="width:${100/Math.max(S.difficultyHistory.length,1)}%;height:${h}px;background:${d>=7?'var(--red)':d>=4?'var(--amber)':'var(--green)'};border-radius:2px 2px 0 0;opacity:${.5+(i/S.difficultyHistory.length)*.5}"></div>`;
  }).join('');

  return `<div class="page">
  ${navHTML(true)}
  <div class="debrief-page">
    <div class="debrief-header"><h1>Call <span>Complete</span></h1><div class="sub">${PRODUCTS.find(p=>p.id===S.productPreset)?.label||'Custom Product'} -- ${S.buyerName} -- ${fmtTime(S.seconds)}</div></div>
    <div class="score-hero">
      <div class="big-num" style="color:${col}">${ov}</div><div class="out-of">/ 100</div>
      <div class="grade" style="color:${col}">Grade: ${sc.grade||'C'}</div>
      <div class="diff-range">Started at Level ${start}, peaked at Level ${peak}</div>
      <div style="display:flex;align-items:flex-end;gap:1px;height:${maxH}px;margin:10px auto 0;max-width:180px">${curve}</div>
    </div>
    <div class="card" style="animation-delay:.1s"><h3>Category Breakdown</h3>${bars}</div>
    <div class="card" style="animation-delay:.2s"><h3>Conversation Replay</h3>${replay}</div>
    <div class="card" style="animation-delay:.3s"><h3 style="color:var(--green)">What You Did Well</h3><ul class="fb-list green">${strengths}</ul></div>
    <div class="card" style="animation-delay:.4s"><h3 style="color:var(--red)">What Cost You Points</h3><ul class="fb-list red">${weaknesses}</ul></div>
    ${best?`<div class="card" style="animation-delay:.5s"><h3 style="color:var(--green)">Your Strongest Moment</h3>${best}</div>`:''}
    ${worst?`<div class="card" style="animation-delay:.55s"><h3 style="color:var(--red)">Your Weakest Moment</h3>${worst}</div>`:''}
    ${sc.tip?`<div class="card" style="animation-delay:.6s"><h3>Pro Tip for Next Time</h3><div class="tip-box">${escHtml(sc.tip)}</div></div>`:''}
    <div class="actions" style="animation-delay:.7s">
      <button class="btn-primary-action" onclick="retryHarder()">Try Again (Harder)</button>
      <button class="btn-secondary-action" onclick="navigate('#/setup')">New Setup</button>
      <button class="btn-tertiary-action" onclick="navigate('#/dashboard')">Back to Dashboard</button>
    </div>
    <div style="height:36px"></div>
  </div>
</div>`;
}

function fmtTime(sec){return Math.floor(sec/60)+'m '+(sec%60)+'s'}

function retryHarder(){
  S.startDifficulty=Math.min(10,S.currentDifficulty+1);
  S.productPreset=S.productPreset||'custom';
  S.buyerPreset=S.buyerPreset||'custom';
  navigate('#/call');
}

function showToast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);
}

// Animate bars on debrief
const debriefObs=new MutationObserver(()=>{
  document.querySelectorAll('.bar-fill[data-target]').forEach(b=>{setTimeout(()=>{b.style.width=b.dataset.target+'%'},100)});
});
debriefObs.observe(document.getElementById('app'),{childList:true,subtree:true});
</script>
</body>
</html>
