<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitchForge - Voice Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0a09;color:#f5f5f4;font-family:Inter,-apple-system,sans-serif;min-height:100vh;padding:20px}
h1{font-size:28px;margin-bottom:4px;color:#f97316}
.sub{color:#a8a29e;margin-bottom:20px;font-size:14px}
.setup{max-width:500px;margin:0 auto 20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:#a8a29e;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;background:#1c1917;border:1px solid #292524;border-radius:8px;color:#e7e5e4;font-size:15px;outline:none;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:#f97316}
.field textarea{resize:vertical;min-height:80px}
.hint{font-size:12px;color:#78716c;margin-top:4px}
.actions{display:flex;gap:12px;margin-bottom:20px}
.btn{padding:14px 32px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-green{background:#10b981;color:#fff}.btn-green:hover{background:#059669}
.btn-orange{background:#f97316;color:#fff}.btn-orange:hover{background:#ea580c}
.btn-red{background:#ef4444;color:#fff}.btn-red:hover{background:#dc2626}
.btn-ghost{background:#1c1917;color:#a8a29e;border:1px solid #292524}.btn-ghost:hover{border-color:#f97316;color:#f97316}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
#status{background:#1c1917;border:1px solid #292524;border-radius:12px;padding:20px;width:100%;max-width:500px;margin:0 auto 20px;font-family:monospace;font-size:14px;line-height:1.6;white-space:pre-wrap;min-height:120px;display:block}
.center{text-align:center}
</style>
</head>
<body>
<div class="center">
<h1>PitchForge</h1>
<p class="sub">AI sales call simulator</p>
</div>

<div class="setup">
  <div class="field">
    <label>What are you selling?</label>
    <input id="product" placeholder="e.g. Vet INC - AI revenue intelligence for vet clinics">
  </div>
  <div class="field">
    <label>Who are you calling? (optional)</label>
    <input id="buyer" placeholder="e.g. VP of Operations at a mid-size vet clinic chain">
  </div>
  <div class="field">
    <label>Script / talking points (optional)</label>
    <textarea id="script" placeholder="Paste your script or key talking points here..."></textarea>
    <div class="hint">The AI buyer will see this and react to how well you follow it</div>
  </div>
  <div class="field">
    <label>Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy - friendly, interested</option>
      <option value="medium" selected>Medium - skeptical but fair</option>
      <option value="hard">Hard - hostile, short temper</option>
      <option value="expert">Expert - ruthless negotiator</option>
    </select>
  </div>
</div>

<div class="btn-row">
  <button class="btn btn-ghost" onclick="randomize()">Random Product</button>
  <button id="callBtn" class="btn btn-green" onclick="startCall()">Start Voice Call</button>
</div>

<div class="center">
<div id="status">Ready.</div>
</div>

<script type="module">

const statusEl = document.getElementById('status');
const callBtn = document.getElementById('callBtn');
function log(msg) { statusEl.textContent += '\n' + msg; statusEl.scrollTop = statusEl.scrollHeight; }

// ===== SCENARIO ENGINE =====
let currentScenario = null;

window.randomCall = function() {
  const s = SCENARIOS[Math.floor(Math.random() * SCENARIOS.length)];
  currentScenario = s;
  
  // Show scenario card

      </div>
      <span style="background:${s.difficulty==='easy'?'#10b981':s.difficulty==='medium'?'#f59e0b':s.difficulty==='hard'?'#ef4444':'#8b5cf6'};color:#000;padding:0.3rem 0.8rem;border-radius:20px;font-size:0.75rem;font-weight:600;text-transform:uppercase">${s.difficulty}</span>

// Override startCall to pass full scenario context to the agent
const origStartCall = window.startCall;
window.startCall = async function() {
  if (isConnected && client) {
    client.stopCall();
    isConnected = false;
    callBtn.textContent = 'Start Voice Call';
    callBtn.className = 'btn btn-green';
    return;
  }
  if (!currentScenario) {
    alert('Hit "Random Call" first to get your scenario!');
    return;
  }
  try {
    const s = currentScenario;
    log('Connecting to buyer: ' + s.buyer);
    callBtn.disabled = true;
    callBtn.textContent = 'Connecting...';

    const resp = await fetch('https://api.retellai.com/v2/create-web-call', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + RETELL_KEY },
      body: JSON.stringify({
        agent_id: RETELL_AGENT,
        dynamic_variables: {
          product: s.product,
          company_name: s.company,
          company_description: s.companyDesc,
          buyer_persona: s.buyer + '. Personality: ' + s.buyerPersona,
          pain_points: s.painPoints,
          goal: s.goal,
          rules: s.rules,
          script: s.script,
          difficulty: s.difficulty
        }
      })
    });
    const data = await resp.json();
    if (!data.access_token) { log('ERROR: ' + JSON.stringify(data).substring(0,300)); callBtn.disabled=false; callBtn.textContent='Start Voice Call'; callBtn.className='btn btn-green'; return; }
    log('Connected. Start pitching!');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop());
    } catch(micErr) {
      log('MIC DENIED: ' + micErr.message); callBtn.disabled=false; callBtn.textContent='Start Voice Call'; callBtn.className='btn btn-green'; return;
    }
    const RC = window.RetellWebClient;
    if (!RC) { log('SDK not loaded'); callBtn.disabled=false; callBtn.textContent='Start Voice Call'; return; }
    client = new RC();
    client.on('agentTalk', (e) => { if(e.transcript) log('BUYER (' + s.buyer.split(',')[0] + '): ' + e.transcript); });
    client.on('userTalk', (e) => { if(e.transcript) log('YOU: ' + e.transcript); });
    client.on('audioStarted', () => { log('>>> Buyer is speaking...'); });
    client.on('open', () => { log('>>> Call connected'); });
    client.on('close', () => { log('>>> Call ended'); isConnected=false; callBtn.textContent='Start Voice Call'; callBtn.className='btn btn-green'; callBtn.disabled=false; });
    client.on('error', (err) => { log('>>> ERROR: ' + JSON.stringify(err)); isConnected=false; callBtn.textContent='Start Voice Call'; callBtn.className='btn btn-green'; callBtn.disabled=false; });
    await client.startCall({ accessToken: data.access_token });
    isConnected = true;
    callBtn.disabled = false;
    callBtn.textContent = 'End Call';
    callBtn.className = 'btn btn-red';
  } catch(e) {
    log('ERROR: ' + e.message);
    callBtn.disabled=false; callBtn.textContent='Start Voice Call'; callBtn.className='btn btn-green';
  }
};
