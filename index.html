<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitchForge - Voice Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0a09;color:#f5f5f4;font-family:Inter,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-size:28px;margin-bottom:8px;color:#f97316}
p{color:#a8a29e;margin-bottom:24px;text-align:center}
#status{background:#1c1917;border:1px solid #292524;border-radius:12px;padding:20px;width:100%;max-width:500px;min-height:200px;margin-bottom:20px;font-family:monospace;font-size:14px;line-height:1.6;white-space:pre-wrap}
.btn{padding:16px 40px;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-green{background:#10b981;color:#fff}.btn-green:hover{background:#059669}
.btn-red{background:#ef4444;color:#fff}.btn-red:hover{background:#dc2626}
.btn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<h1>PitchForge Voice Test</h1>
<p>Click to start a browser voice call with the AI buyer</p>
<div id="status">Ready. Click the button below.</div>
<button id="callBtn" class="btn btn-green" onclick="startCall()">Start Voice Call</button>
<script type="module">
import { RetellWebClient } from 'https://esm.sh/retell-client-js-sdk@2.0.7';
window.RetellWebClient = RetellWebClient;
const RETELL_KEY = 'key_c833df9a891bacfc002cf8714c0c';
const RETELL_AGENT = 'agent_2d2969f4f54ab3192ceaf4ab5e';
let client = null;
let isConnected = false;
const statusEl = document.getElementById('status');
const callBtn = document.getElementById('callBtn');
function log(msg) { statusEl.textContent += '\n' + msg; statusEl.scrollTop = statusEl.scrollHeight; }

window.startCall = async function() {
  if (isConnected && client) {
    log('Stopping call...');
    client.stopCall();
    isConnected = false;
    callBtn.textContent = 'Start Voice Call';
    callBtn.className = 'btn btn-green';
    return;
  }
  try {
    log('Creating web call...');
    callBtn.disabled = true;
    callBtn.textContent = 'Connecting...';
    const resp = await fetch('https://api.retellai.com/v2/create-web-call', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + RETELL_KEY },
      body: JSON.stringify({ agent_id: RETELL_AGENT })
    });
    const data = await resp.json();
    log('Response: ' + resp.status);
    if (!data.access_token) { log('ERROR: ' + JSON.stringify(data).substring(0,200)); callBtn.disabled=false; callBtn.textContent='Start Voice Call'; callBtn.className='btn btn-green'; return; }
    log('Got token. Requesting mic...');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      log('Mic granted. Tracks: ' + stream.getAudioTracks().length);
      stream.getTracks().forEach(t => t.stop());
    } catch(micErr) {
      log('MIC DENIED: ' + micErr.message);
      callBtn.disabled=false; callBtn.textContent='Start Voice Call'; callBtn.className='btn btn-green';
      return;
    }
    log('Starting Retell client...');
    const RC = window.RetellWebClient;
    if (!RC) { log('SDK not loaded'); callBtn.disabled=false; callBtn.textContent='Start Voice Call'; return; }
    client = new RC();
    client.on('agentTalk', (e) => { if(e.transcript) log('BUYER: ' + e.transcript); });
    client.on('userTalk', (e) => { if(e.transcript) log('YOU: ' + e.transcript); });
    client.on('audioStarted', () => { log('>>> Agent is speaking'); });
    client.on('open', () => { log('>>> Connection OPEN'); });
    client.on('close', () => { log('>>> Connection CLOSED'); isConnected=false; callBtn.textContent='Start Voice Call'; callBtn.className='btn btn-green'; callBtn.disabled=false; });
    client.on('error', (err) => { log('>>> ERROR: ' + JSON.stringify(err)); isConnected=false; callBtn.textContent='Start Voice Call'; callBtn.className='btn btn-green'; callBtn.disabled=false; });
    await client.startCall({ accessToken: data.access_token });
    isConnected = true;
    callBtn.disabled = false;
    callBtn.textContent = 'End Call';
    callBtn.className = 'btn btn-red';
    log('Call started! Speak into your mic.');
  } catch(e) {
    log('ERROR: ' + e.message);
    callBtn.disabled=false; callBtn.textContent='Start Voice Call'; callBtn.className='btn btn-green';
  }
};
log('Retell SDK loaded: ' + (typeof window.RetellWebClient !== 'undefined'));
</script>
</body>
</html>
